name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Frontend Vitest
        run: npm run test

      - name: Frontend Svelte Check
        run: npm run check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Check
        run: |
          cd src-tauri
          cargo check --verbose
